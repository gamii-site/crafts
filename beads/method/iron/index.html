<!doctype html>
<html lang="ja-JP">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アイロンビーズ３D(立体)のレシピ集：がみ〜工房-工作室</title>
    <meta 
      name='description' 
      content='子供たちのワクワクを、アイロンビーズでの３D工作で応援するページです。アイロンビーズ３Dのアイデアをまとめました。参考になれれば嬉しいです。'
      />
  </head>
  <body>
    <div id="message"></div>
    <script>
      queueMicrotask(() => {
        const pathname = window.location.pathname;
        const hash = window.location.hash;
        window.location.replace('https://gamii-site.github.io/crafts/?path=' + pathname + hash);　　　　　　　　　　　　　　　　　　　　　　
      });
      const msgArea = document.getElementById('message');
      if (msgArea) {
        msgArea.innerHTML = '<p>少々お待ちください。<br/>ページ情報を構築します。</p>';
      }
    </script>
    <noscript>
      <p>
        このページは JavaScript を使用しています。ブラウザーの設定で JavaScript を有効にしてください。
      </p>
    </noscript>
  </body>
</html>
