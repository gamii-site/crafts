    <style>
      @property --fluctuation-color { syntax: '<color>'; inherits: false; initial-value: transparent; }
      @property --fluctuation-shadow-color { syntax: '<color>'; inherits: false; initial-value: transparent; }
      body {
        --splash-z-index: 2000;
        --body-margin: 1px;
        margin: var(--body-margin);
        width: calc(100dvw - (var(--body-margin) * 2));
        height: calc(100dvh - (var(--body-margin) * 2));
        position: relative;
        overflow: hidden;
        > span {
          position: absolute;
          top: calc(50% + 4rem);
          left: 50%;
          transform: translateX(-50%) translateY(-50%);
          z-index: var(--splash-z-index);
          opacity: 0;
          font-size: 1.5rem;
          font-weight: bold;
          white-space: nowrap;
          color: rgb(255 255 255 / 0);
          animation: splasPhrase 3s forwards 1s, splashMoveToBack 4s forwards, toNone 1s forwards 30s;
        }
        > span:nth-of-type(2) {
          background: repeating-radial-gradient(circle at center -4rem, var(--fluctuation-color) 0 0.1rem, transparent 0.4rem 0.5rem, var(--fluctuation-color) 0.9rem);
          background-clip: text;
          text-shadow: 0 0 5px var(--fluctuation-shadow-color);
          animation: splasPhrase 3s forwards 1.1s, splashMoveToBack 4s forwards, splasPhraseFluctuation 3s forwards 1.1s, toNone 1s forwards 30s;
        }
        > svg {
          position: absolute;
          z-index: var(--splash-z-index);
          width: 100%;
          height: 100%;
          --svg-repples-bg-color: blue;
          --svg-repples-color: white;
          --svg-repples-dur-scale: 1;
          --svg-repples-blur-color: rgb(255 255 255 / 0.8);
          animation: splashMoveToBack 4s forwards, toNone 1s forwards 30s;
        }
      }
      @keyframes splasPhraseFluctuation {
        0%, 50% {
          --fluctuation-color: transparent;
          --fluctuation-shadow-color: transparent;
        }
        51%, 80% {
          --fluctuation-color: rgb(200 200 255 / 0.9);
          --fluctuation-shadow-color: rgb(200 200 250 / 0.5);
        }
        95% {
          --fluctuation-shadow-color: rgb(200 200 250 / 0.4);
        }
        100% {
          --fluctuation-color: transparent;
          --fluctuation-shadow-color: transparent;
        }
      }
      @keyframes splasPhrase {
        0% {
          color: rgb(255 255 255 / 0);
        }
        50% {
          color: rgb(255 255 255 / 1);
          font-size: 1.5rem;
          top: calc(50% + 4rem);
        }
        100% {
          color: rgb(255 255 255 / 0);
          font-size: 3rem;
          top: calc(50% + 6rem);
        }
      }
      @keyframes splashMoveToBack {
        0%, 90% {
          z-index: var(--splash-z-index);
          opacity: 1;
        }
        99% {
          z-index: var(--splash-z-index);
          opacity: 0.6;
        }
        100% {
          z-index: -1;
          opacity: 0.5;
        }
      }
      @keyframes toNone {
        0% {  }
        100% { display: none; }
      }
    </style>
    <svg>
  <defs>
    <g id='animetion-ripple'>
      <radialGradient id='gradient-ripple'>
        <stop offset='90%' style='stop-color: var(--svg-repples-color, blue); stop-opacity: 0' />
        <stop offset='100%' style='stop-color: var(--svg-repples-color, blue); stop-opacity: 1' />
      </radialGradient>
      <circle id='circle0' cx='50%' cy='50%' r='1%' fill='var(--svg-repples-color, blue)' fill-opacity='0' stroke='var(--svg-repples-color, blue)' stroke-width='1' />
      <circle id='circle1' cx='50%' cy='50%' r='1%' fill='none' stroke='url(#gradient-ripple)' stroke-width='0.1%' />
      <circle id='circle2' cx='50%' cy='50%' r='1%' fill='none' stroke='url(#gradient-ripple)' stroke-width='0.1%' />
      <circle id='circle3' cx='50%' cy='50%' r='1%' fill='none' stroke='url(#gradient-ripple)' stroke-width='0.1%' />
      <circle id='circle4' cx='50%' cy='50%' r='1%' fill='none' stroke='url(#gradient-ripple)' stroke-width='0.1%' />
      <style>
        #circle0 {
          animation: animetion-epicenter-frames calc(1s * var(--svg-repples-dur-scale, 1)) linear calc(var(--base-delay-time, 0s) + 100ms) infinite;
        }
        #circle1 {
          animation: animetion-ripples-frames calc(2s * var(--svg-repples-dur-scale, 1)) linear calc((var(--base-delay-time, 0s) + 1100ms) * var(--svg-repples-dur-scale, 1)) infinite;
        }
        #circle2 {
          animation: animetion-ripples-frames calc(2s * var(--svg-repples-dur-scale, 1)) linear calc((var(--base-delay-time, 0s) + 1250ms) * var(--svg-repples-dur-scale, 1)) infinite;
        }
        #circle3 {
          animation: animetion-ripples-frames calc(2s * var(--svg-repples-dur-scale, 1)) linear calc((var(--base-delay-time, 0s) + 2100ms) * var(--svg-repples-dur-scale, 1)) infinite;
        }
        #circle4 {
          animation: animetion-ripples-frames calc(2s * var(--svg-repples-dur-scale, 1)) linear calc((var(--base-delay-time, 0s) + 2250ms) * var(--svg-repples-dur-scale, 1)) infinite;
        }
        @keyframes animetion-epicenter-frames {
          50% {
            fill-opacity: 0;
          }
          100% {
            fill-opacity: 1;
          }
        }
        @keyframes animetion-ripples-frames {
          50% {
            r: 20%;
            stroke-width: 3%;
            opacity: 0.5;
          }
          80% {
            r: 32%;
            stroke-width: 1%;
            opacity: 0.05;
          }
          90% {
            r: 36%;
            stroke-width: 0.5%;
            opacity: 0.01;
          }
          100% {
            r: 40%;
            stroke-width: 0;
            opacity: 0;
          }
        }
      </style>
    </g>

  <rect x='0' y='0' width='100%' height='100%' fill='var(--svg-repples-bg-color, black)' />

  <style>
    #ripple1, #ripple2, #ripple3 {
      --total-delay-time: calc(var(--base-delay-time) - var(--animetion-enter-time));
      opacity: 0;
      animation: enter calc(var(--animetion-enter-time) * var(--svg-repples-dur-scale, 1)) linear calc(var(--total-delay-time) * var(--svg-repples-dur-scale, 1)) 1 forwards;
    }
    #ripple1 {
      --animetion-enter-time: 3s;

    #ripple2 {

      --base-delay-time: 4200ms;
    }
    #ripple3 {
      --animetion-enter-time: 3s;
      --base-delay-time: 8700ms;
    }
    @keyframes enter {
      100% {
        opacity: 1;
      }
    }
  </style>
